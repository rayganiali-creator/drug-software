name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build MedSmarter.sln -c Release -warnaserror
      - run: dotnet test MedSmarter.sln -c Release --no-build
      - name: Check migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            -p src/BuildingBlocks/MedSmarter.BuildingBlocks.Infrastructure \
            -s src/Host/MedSmarter.Api -c PlatformDbContext

  integration:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Generate throwaway local secrets and start the stack
        run: |
          ./scripts/init-env.sh
          docker compose up -d --wait postgres redis opensearch kafka
      - name: Apply migrations and run integration tests
        run: |
          set -a; . ./.env; set +a
          dotnet run --project src/Host/MedSmarter.Api -c Release --no-launch-profile -- --migrate-and-exit
          MEDSMARTER_IT=1 dotnet test tests/MedSmarter.IntegrationTests -c Release
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for QA
        run: npx playwright-core install --with-deps chromium
      - name: Accessibility, RTL and interaction QA
        run: |
          npm run preview &
          curl --retry 15 --retry-connrefused --retry-delay 1 -s -o /dev/null http://127.0.0.1:4173/
          mkdir -p /tmp/qa
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          node scripts/qa.mjs --out /tmp/qa
          node scripts/flow.mjs

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated design artefacts are up to date and contrast rules pass
        run: node design/build.mjs --check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file and build application images
        run: |
          ./scripts/init-env.sh
          docker compose --profile app config -q
          docker compose --profile app build
