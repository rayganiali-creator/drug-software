# Local development stack. Infrastructure is always started; application containers need
# `--profile app`. Every published port is bound to 127.0.0.1 only. NOT a production configuration.
name: medsmarter

x-app-env: &app-env
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-medsmarter};Username=${POSTGRES_USER:-medsmarter};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
  OpenSearch__Uri: "http://opensearch:9200"
  Kafka__BootstrapServers: "kafka:9092"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsmarter}
      POSTGRES_USER: ${POSTGRES_USER:-medsmarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      # DEV ONLY: security plugin disabled so no TLS/admin password is needed locally.
      # Production must enable it (TLS + RBAC); tracked in docs/known-issues.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    # Single-node KRaft (no ZooKeeper). INTERNAL for containers, EXTERNAL for host tools.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------- application containers (profile: app) ----------------
  migrator:
    profiles: [app]
    build: { context: ., dockerfile: src/Host/MedSmarter.Api/Dockerfile }
    command: ["--migrate-and-exit"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    profiles: [app]
    build: { context: ., dockerfile: src/Host/MedSmarter.Api/Dockerfile }
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:8080
      # LOCAL DEV STACK ONLY: enables the fictional DevelopmentMock login (refused by the API in any other environment).
      ASPNETCORE_ENVIRONMENT: Development
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ai:
    profiles: [app]
    build: { context: ai }
    environment:
      AI_OPENSEARCH_URI: http://opensearch:9200
      AI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      opensearch: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080}
    ports: ["127.0.0.1:3000:8080"]

volumes:
  pgdata:
  redisdata:
  osdata:
  kafkadata:
