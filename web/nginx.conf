server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # connect-src is widened to the API origin at deploy time (Phase 13).
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:5080; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location / { try_files $uri /index.html; }
}
